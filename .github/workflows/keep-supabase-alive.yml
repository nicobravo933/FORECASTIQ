name: Keep Supabase Alive

on:
  schedule:
    # Cada 3 días a las 09:00 UTC — bien por debajo del umbral de pausa (7 días)
    - cron: "0 9 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health endpoint
        run: |
          curl -sf -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
